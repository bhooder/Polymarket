# Runs the forward test every 10 minutes on GitHub's computers and saves the results back here.
name: Forward test (every 10 min)

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # asked for every 10 min; GitHub often runs late or skips when busy
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab
    inputs:
      daily_check:
        description: "Send the account check to Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forward-test       # never two runs at once

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York  # times in the reports show Eastern time
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests cryptography
      - run: python -u forward_test.py
        env:
          # Real-money betting (live.py). LIVE_TRADING is a repository variable: off, practice or on.
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          SEND_CHECK: ${{ inputs.daily_check }}  # ticked box on a manual run: send the account check now
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PM_US_KEY_ID: ${{ secrets.PM_US_KEY_ID }}
          PM_US_SECRET_KEY: ${{ secrets.PM_US_SECRET_KEY }}
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}  # also needed for ProphetX prices
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trades.json paper_trades.csv paper_trades_b.json paper_trades_b.csv paper_trades_c.json paper_trades_c.csv live_trades.json live_trades.csv live_log.json paper_report.html picks.html
          git diff --cached --quiet && exit 0
          git commit -m "Forward test run $(date '+%Y-%m-%d %H:%M')"
          # retry: a brief GitHub hiccup must not throw away a run's results (real bets included)
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
